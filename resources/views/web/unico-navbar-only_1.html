<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unico Connect - Navbar Only</title>
<style>
  :root{
    --special_blue:#1e5eff;
    --special_blue-dark:#1a4fe0;
    --text-dark:#0b0b0f;
    --bg-top:#eef3ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, #ffffff 60%);
    min-height: 250vh;
    overflow-x: hidden;
  }

  /* ---------- NAVBAR WRAPPER ---------- */
  .special_navbar-wrap{
    position: sticky;
    top: 0;
    z-index: 100;
    display:flex;
    justify-content:center;
    padding: 0;
    background: #fff;
    transition: padding 0.35s ease, background 0.35s ease;
  }
  /* .special_at-top = page just loaded / not scrolled yet = larger floating "sticky" pill bar */
  .special_navbar-wrap.special_at-top{
    padding: 16px 20px 0 20px;
    background: transparent;
  }
  /* no .special_at-top (i.e. user has scrolled) = "normal" compact bar, full width */
  .special_navbar-wrap:not(.special_at-top){
    padding: 0;
    background: #fff;
  }

  .special_navbar{
    width: 100%;
    max-width: 1400px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border-radius: 0;
    box-shadow: 0 2px 12px rgba(20,30,60,0.08);
    padding: 14px 40px;
    transition: padding 0.35s ease, box-shadow 0.35s ease, border-radius 0.35s ease, max-width 0.35s ease;
  }
  .special_navbar-wrap.special_at-top .special_navbar{
    max-width: 1400px;
    border-radius: 100px;
    padding: 20px 32px;
    box-shadow: 0 6px 24px rgba(20,30,60,0.12);
  }

  .special_logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size: 19px;
    color: var(--text-dark);
    white-space: nowrap;
  }
  .special_logo svg{ display:block; width:30px; height:30px; transition: width 0.35s ease, height 0.35s ease; flex-shrink:0; }
  .special_navbar-wrap.special_at-top .special_logo svg{ width: 36px; height: 36px; }
  .special_logo sup{ font-size: 11px; }

  .special_nav-links{
    display:flex;
    align-items:center;
    gap: 30px;
    list-style:none;
  }
  .special_nav-links a{
    text-decoration:none;
    color: var(--text-dark);
    font-weight: 600;
    font-size: 15px;
    display:flex;
    align-items:center;
    gap:4px;
    white-space: nowrap;
    transition: color 0.2s ease;
  }
  .special_nav-links a:hover{ color: var(--special_blue); }
  .special_chevron{
    width: 9px; height: 9px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
    margin-top: -4px;
    flex-shrink:0;
  }

  .special_contact-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--special_blue);
    color:#fff;
    font-weight:700;
    font-size: 14px;
    text-decoration:none;
    padding: 10px 18px;
    border-radius: 100px;
    white-space:nowrap;
    transition: padding 0.35s ease, background 0.2s ease;
  }
  .special_navbar-wrap.special_at-top .special_contact-btn{
    padding: 14px 22px;
    font-size: 15px;
  }
  .special_contact-btn:hover{ background: var(--special_blue-dark); }

  /* ---------- HAMBURGER (mobile) ---------- */
  .special_hamburger{
    display:none;
    flex-direction:column;
    justify-content:center;
    gap:5px;
    width: 30px;
    height: 30px;
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
  }
  .special_hamburger span{
    display:block;
    height:2px;
    width:100%;
    background: var(--text-dark);
    border-radius:2px;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  .special_hamburger.special_open span:nth-child(1){ transform: translateY(7px) rotate(45deg); }
  .special_hamburger.special_open span:nth-child(2){ opacity:0; }
  .special_hamburger.special_open span:nth-child(3){ transform: translateY(-7px) rotate(-45deg); }

  /* .status{
    position: fixed;
    top: 10px;
    left: 10px;
    background: #0b0b0f;
    color: #fff;
    font-size: 11px;
    font-family: monospace;
    padding: 6px 10px;
    border-radius: 6px;
    z-index: 200;
    opacity: 0.75;
  } */

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 1024px){
    .special_nav-links{ gap: 18px; }
    .special_nav-links a{ font-size: 14px; }
    .special_navbar{ padding-left: 24px; padding-right: 24px; }
  }

  @media (max-width: 860px){
    .special_nav-links{
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: min(78vw, 320px);
      background: #fff;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 6px;
      padding: 90px 28px 28px;
      box-shadow: -8px 0 30px rgba(20,30,60,0.15);
      transform: translateX(100%);
      transition: transform 0.35s ease;
      z-index: 150;
    }
    .special_nav-links.special_open{ transform: translateX(0); }
    .special_nav-links li{ width:100%; }
    .special_nav-links a{
      font-size: 17px;
      padding: 12px 0;
      width:100%;
      border-bottom: 1px solid #f0f0f2;
    }
    .special_nav-links .special_contact-btn-mobile{ display:flex; margin-top: 14px; }

    .special_hamburger{ display:flex; }
    .special_contact-btn{ display:none; }

    .special_overlay{
      display:none;
      position:fixed;
      inset:0;
      background: rgba(10,12,20,0.4);
      z-index:140;
    }
    .special_overlay.special_open{ display:block; }

    .special_navbar{ padding-top: 12px; padding-bottom: 12px; }
    .special_logo{ font-size: 16px; }
    .special_logo svg{ width: 26px !important; height: 26px !important; }
  }

  @media (max-width: 640px){
    .special_navbar{ padding-left: 16px; padding-right: 16px; }
    .special_navbar-wrap.special_at-top{ padding: 10px 10px 0 10px; }
    .special_navbar-wrap.special_at-top .special_navbar{ border-radius: 24px; padding: 12px 18px; }
    .status{ display:none; }
  }
</style>
</head>
<body>

<!-- <div class="status" id="status">state: sticky (top)</div>
<div class="special_overlay" id="overlay"></div> -->

<div class="special_navbar-wrap special_at-top" id="navbarWrap">
  <nav class="special_navbar">
    <div class="special_logo">
      <svg viewBox="0 0 40 40" fill="none">
        <rect x="4" y="4" width="26" height="26" rx="8" stroke="#0b0b0f" stroke-width="3"/>
        <circle cx="32" cy="8" r="4" fill="#0b0b0f"/>
        <circle cx="8" cy="32" r="4" fill="#0b0b0f"/>
      </svg>
      Unico Connect<sup>®</sup>
    </div>

    <ul class="special_nav-links" id="navLinks">
      <li><a href="#">Services <span class="special_chevron"></span></a></li>
      <li><a href="#">Hire Developer <span class="special_chevron"></span></a></li>
      <li><a href="#">Case Studies <span class="special_chevron"></span></a></li>
      <li><a href="#">Technologies <span class="special_chevron"></span></a></li>
      <li><a href="#">Blogs</a></li>
      <li><a href="#">Careers</a></li>
      <li><a href="#">About Us</a></li>
      <li><a href="#" class="special_contact-btn special_contact-btn-mobile" style="display:none;">Contact Us →</a></li>
    </ul>

    <a href="#" class="special_contact-btn">Contact Us →</a>
    <button class="special_hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>
</div>

<script>
  const navbarWrap = document.getElementById('navbarWrap');
  const status = document.getElementById('status');
  const hamburger = document.getElementById('hamburger');
  const navLinks = document.getElementById('navLinks');
  const overlay = document.getElementById('overlay');
  const SCROLL_THRESHOLD = 40;

  function onScroll(){
    if(window.scrollY > SCROLL_THRESHOLD){
      navbarWrap.classList.remove('special_at-top');
      status.textContent = 'state: normal (scrolled)';
    } else {
      navbarWrap.classList.add('special_at-top');
      status.textContent = 'state: sticky (top)';
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  function toggleMenu(){
    hamburger.classList.toggle('special_open');
    navLinks.classList.toggle('special_open');
    overlay.classList.toggle('special_open');
    document.body.style.overflow = navLinks.classList.contains('special_open') ? 'hidden' : '';
  }
  hamburger.addEventListener('click', toggleMenu);
  overlay.addEventListener('click', toggleMenu);
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    if(navLinks.classList.contains('special_open')) toggleMenu();
  }));
</script>

</body>
</html>
